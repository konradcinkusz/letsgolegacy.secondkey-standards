name: CodeQL

# Static analysis of the generator and the drift check (REPO-BASELINE.md §1: CodeQL / SAST
# in CI). The generator writes what every migration agent is told and what every gate
# enforces, so its own code is worth the same scrutiny as a gate's.
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '41 3 * * 1'

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    name: analyze (csharp)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - uses: github/codeql-action/init@v4
        with:
          languages: csharp
          build-mode: manual

      - name: Build
        run: dotnet build SecondKey.Standards.slnx --configuration Release

      - uses: github/codeql-action/analyze@v4
