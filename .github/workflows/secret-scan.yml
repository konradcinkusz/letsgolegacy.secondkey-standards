name: Secret scan

# ─────────────────────────────────────────────────────────────────────────────
#  Secret scanning — the CI half of a two-part control (P5; REPO-BASELINE.md §2).
#
#      developer machine                    GitHub
#      ┌──────────────────────┐             ┌──────────────────────────┐
#      │ scripts/hooks/       │             │ this workflow            │
#      │   pre-commit         │  ────────▶  │   • full git history     │
#      │   • staged changes   │             │   • every PR and push    │
#      │   • blocks the commit│             │   • weekly, on schedule  │
#      └──────────────────────┘             └──────────────────────────┘
#        catches the mistake                  catches contributors
#        before it is history                 without hooks
#
#  The scanner image is :latest on purpose: a detection ruleset is only worth what its
#  newest rule catches. Everything else in this repository is pinned.
#
#  pull_request has no branch filter so stacked pull requests (whose base is another
#  feature branch) are scanned too.
# ─────────────────────────────────────────────────────────────────────────────

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '30 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: gitleaks (full history)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout with full history
        uses: actions/checkout@v7
        with:
          # fetch-depth: 0 is load-bearing: a shallow clone scans only the tip, so a secret
          # added and removed earlier in the same branch would pass while still in history.
          fetch-depth: 0

      - name: Scan
        run: |
          set -euo pipefail
          IMAGE="ghcr.io/gitleaks/gitleaks:latest"

          # gitleaks renamed `detect` to `git` in v8.19; probe instead of assuming.
          if docker run --rm "$IMAGE" git --help >/dev/null 2>&1; then
            SUB=(git /repo)
          else
            SUB=(detect --source=/repo)
          fi

          docker run --rm \
            -v "$PWD:/repo" \
            -w /repo \
            "$IMAGE" \
            "${SUB[@]}" \
              --config=/repo/.gitleaks.toml \
              --redact \
              --no-banner \
              --verbose \
              --exit-code 1

      - name: Explain a failure
        if: failure()
        run: |
          {
            echo "## Secret scan failed"
            echo
            echo "A credential-shaped string was found in this repository's history."
            echo
            echo "**This repository is public.** A pushed commit is disclosed the moment it"
            echo "is pushed, so the order of operations is not negotiable:"
            echo
            echo "1. **Rotate the credential.** Now, before anything else."
            echo "2. Remove it from the source; read it from the environment instead."
            echo "3. Only then clean history."
            echo
            echo "If this is a false positive, reword the example (the standards use"
            echo "placeholders, never values) rather than allowlisting a path."
            echo
            echo "Reproduce locally: \`./scripts/scan-secrets.sh\`"
          } >> "$GITHUB_STEP_SUMMARY"
