name: CI

# Build, test, hold the standards to their contract, prove the generated tree is current, and
# pack the NuGet packages.
#
# pull_request has no branch filter on purpose: pull requests in this repository are stacked
# (each one's base is the previous feature branch), and a filter on main would leave all but the
# first without CI. Tags (v*) run the release guard, because a tag is what consumers pin.

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  build-test:
    name: Build, test and check the generated tree
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Test
        run: dotnet test --no-build --configuration Release

      # The C4-a acceptance criterion as a CI step: every rule has an id, a severity, a
      # rationale, a compliant and a non-compliant example — and every mapping, vocabulary and
      # file name is checked with it. Problems are annotated on the pull request's diff.
      - name: Validate the standards
        run: dotnet run --project src/SecondKey.Standards.Generator --no-build --configuration Release -- validate

      # The C4-b acceptance criterion: a change to a rule, the pack metadata or the skill template
      # that is not accompanied by the regenerated output fails here, naming each stale file. It
      # also refuses a content change to a version that is already released.
      - name: Generated tree is current
        run: dotnet run --project src/SecondKey.Standards.Generator --no-build --configuration Release -- generate --check

      # The check above proves nothing unless it can fail. Make the tree stale on purpose — edit a
      # rule without regenerating, then hand-edit a generated file — and require --check to refuse
      # both, before restoring the checkout.
      - name: The staleness check fails on a stale tree (self-test)
        run: |
          set -euo pipefail
          # GITHUB_ACTIONS=false: the expected failures below must not become annotations on the PR.
          check() { GITHUB_ACTIONS=false dotnet run --project src/SecondKey.Standards.Generator --no-build --configuration Release -- generate --check; }

          echo "An edit that was never regenerated." >> standards/SK-MIG-001-replace-system-web.md
          if check; then echo "::error::generate --check passed after a rule changed"; exit 1; fi
          git checkout -- standards/

          echo "dotnet_diagnostic.CA1310.severity = none" >> generated/config/.globalconfig
          if check; then echo "::error::generate --check passed after a generated file was edited"; exit 1; fi
          git checkout -- generated/

          check

  package:
    name: Pack and verify the NuGet packages
    needs: build-test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      # Packs SecondKey.Standards from generated/nuget/ and builds a throwaway consumer against it:
      # the analyzer configuration must reach the consumer's compiler through build/ props, and
      # the opt-out property must switch it off.
      - name: Pack SecondKey.Standards and verify it in a consuming build
        run: ./scripts/verify-package.sh "${{ runner.temp }}/packages"

      - name: Pack the secondkey-standards tool
        run: dotnet pack src/SecondKey.Standards.Generator --configuration Release --output "${{ runner.temp }}/packages"

      # Workflow artifacts only; nothing is published to nuget.org.
      - name: Upload the packages
        uses: actions/upload-artifact@v7
        with:
          name: secondkey-standards-packages
          path: ${{ runner.temp }}/packages/*.nupkg
          if-no-files-found: error

  # The C4-c acceptance criterion: the drift-check step, run exactly as a consumer runs it
  # (uses: ./actions/drift-check), fails for a fixture repository with a stale pin and passes for a
  # current one. The release source is a git repository built from the commit under test and tagged
  # with the pack's version, so the check reads real tags, a real changelog and a real manifest,
  # offline. The three failing fixtures also leave error annotations on the run: they are expected.
  drift-check:
    name: Drift check on fixture consumers
    needs: build-test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Publish a release source for this commit
        id: source
        run: |
          set -euo pipefail
          VERSION="$(jq -r .version catalog/pack.json)"
          SOURCE="${RUNNER_TEMP}/standards-source.git"
          git init --quiet --bare "${SOURCE}"
          git push --quiet "${SOURCE}" HEAD:refs/heads/main
          git -C "${SOURCE}" tag "v${VERSION}" main
          echo "path=${SOURCE}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      # What a consumer does to upgrade: copy the skill, set the package version. Built from this
      # commit, so it is current by construction and never needs editing when the version moves.
      - name: Assemble a current consumer
        env:
          VERSION: ${{ steps.source.outputs.version }}
        run: |
          set -euo pipefail
          CONSUMER="${RUNNER_TEMP}/consumer-current"
          mkdir -p "${CONSUMER}/.github/skills"
          cp -R generated/skills/applying-dotnet-migration-standards "${CONSUMER}/.github/skills/"
          printf '<Project>\n  <ItemGroup>\n    <GlobalPackageReference Include="SecondKey.Standards" Version="%s" />\n  </ItemGroup>\n</Project>\n' \
            "${VERSION}" > "${CONSUMER}/Directory.Packages.props"

      - name: 'Current pin: the step passes'
        id: current
        uses: ./actions/drift-check
        with:
          working-directory: ${{ runner.temp }}/consumer-current
          source: ${{ steps.source.outputs.path }}

      - name: 'Stale pin: the step fails (expected)'
        id: stale
        continue-on-error: true
        uses: ./actions/drift-check
        with:
          working-directory: tests/fixtures/drift/stale
          source: ${{ steps.source.outputs.path }}

      - name: 'Disagreeing pins: the step fails (expected)'
        id: disagreeing
        continue-on-error: true
        uses: ./actions/drift-check
        with:
          working-directory: tests/fixtures/drift/disagreeing
          source: ${{ steps.source.outputs.path }}

      - name: 'Unpinned: the step fails (expected)'
        id: unpinned
        continue-on-error: true
        uses: ./actions/drift-check
        with:
          working-directory: tests/fixtures/drift/unpinned
          source: ${{ steps.source.outputs.path }}

      - name: Each fixture got the expected outcome
        env:
          CURRENT: ${{ steps.current.outcome }}/${{ steps.current.outputs.status }}
          STALE: ${{ steps.stale.outcome }}/${{ steps.stale.outputs.status }}
          DISAGREEING: ${{ steps.disagreeing.outcome }}/${{ steps.disagreeing.outputs.status }}
          UNPINNED: ${{ steps.unpinned.outcome }}/${{ steps.unpinned.outputs.status }}
        run: |
          FAILED=0
          expect() {
            if [ "$2" = "$3" ]; then echo "$1: $2"; else echo "::error::$1 fixture: expected $3, got $2"; FAILED=1; fi
          }
          expect current "${CURRENT}" "success/current"
          expect stale "${STALE}" "failure/behind"
          expect disagreeing "${DISAGREEING}" "failure/disagree"
          expect unpinned "${UNPINNED}" "failure/unpinned"
          exit "${FAILED}"

  release-guard:
    name: Release guard
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      # A tag is what a consuming repository pins and what the drift check compares against, so
      # it must name exactly the version the tagged commit generates, and that version must be
      # dated in CHANGELOG.md (a dated version's content is frozen by the generator's version gate).
      - name: The tag matches a released pack version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          VERSION="$(jq -r .version catalog/pack.json)"
          if [ "${TAG}" != "v${VERSION}" ]; then
            echo "::error::Tag ${TAG} does not match catalog/pack.json version ${VERSION} (expected v${VERSION})."
            exit 1
          fi
          if ! grep -Eq "^## \[${VERSION}\] (—|–|-) [0-9]{4}-[0-9]{2}-[0-9]{2}$" CHANGELOG.md; then
            echo "::error::CHANGELOG.md does not date version ${VERSION}; replace 'Unreleased' with the release date before tagging."
            exit 1
          fi
          if [ "$(jq -r .version generated/manifest.json)" != "${VERSION}" ]; then
            echo "::error::generated/manifest.json is not at version ${VERSION}; regenerate before tagging."
            exit 1
          fi
          echo "Tag ${TAG} releases standards ${VERSION}."
