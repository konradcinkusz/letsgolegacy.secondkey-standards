name: CI

# Build, test, and hold the standards to their contract.
#
# pull_request has no branch filter on purpose: pull requests in this repository are stacked
# (each one's base is the previous feature branch), and a filter on main would leave all but the
# first without CI.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  build-test:
    name: Build, test and validate the standards
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Test
        run: dotnet test --no-build --configuration Release

      # The C4-a acceptance criterion as a CI step: every rule has an id, a severity, a
      # rationale, a compliant and a non-compliant example — and every mapping, vocabulary and
      # file name is checked with it. Problems are annotated on the pull request's diff.
      - name: Validate the standards
        run: dotnet run --project src/SecondKey.Standards.Generator --no-build --configuration Release -- validate
